<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>幸福二选一 · 锦标赛</title>
<style>
  :root{
    --bg1:#ffd6e7; --bg2:#ffe9c7;
    --accent:#ff5e8a; --accent2:#ff8f5e;
    --card:#ffffff; --ink:#3a2b33; --sub:#9a8590;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;}

  header{padding:22px 4px 8px;text-align:center;}
  header h1{margin:0;font-size:26px;letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  header p{margin:6px 0 0;font-size:13px;color:var(--sub);letter-spacing:1px;}

  #start{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;gap:18px;}
  #start .emoji{font-size:64px;animation:bob 2.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #start .tip{font-size:14px;color:var(--sub);text-align:center;line-height:1.7;padding:0 18px;}
  #start .bracket-mini{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6;text-align:center;}

  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;border-radius:999px;padding:14px 40px;font-size:17px;
    box-shadow:0 8px 20px rgba(255,94,138,.35);transition:transform .12s,box-shadow .12s;
  }
  .btn:active{transform:scale(.95);box-shadow:0 4px 12px rgba(255,94,138,.3);}
  .btn.ghost{background:#fff;color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.06);}

  #game{display:none;flex:1;flex-direction:column;}

  .progress{display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--sub);padding:4px 6px 10px;}
  .progress .count{font-weight:700;color:var(--accent);font-size:15px;}
  .round-tag{display:inline-block;background:#fff;border:1px solid #f4d4e1;border-radius:8px;
    padding:3px 10px;font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:10px;text-align:center;}
  .round-tag b{color:var(--accent2);}

  .vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;}
  .card{
    background:var(--card);border-radius:22px;padding:24px 14px;min-height:170px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:22px;font-weight:800;line-height:1.35;cursor:pointer;
    box-shadow:0 10px 26px rgba(180,90,120,.18);
    border:3px solid transparent;transition:transform .12s,border-color .15s,opacity .15s;
    user-select:none;word-break:break-all;
  }
  .card small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:8px;letter-spacing:2px;}
  .card:active{transform:scale(.97);}
  .card.pick{border-color:var(--accent);background:#fff5f8;}
  .card.dim{opacity:.4;}

  .or{display:flex;justify-content:center;align-items:center;color:var(--accent);
    font-weight:800;font-size:14px;margin:12px 0;letter-spacing:1px;}

  .trail{padding:14px 6px 6px;}
  .trail-title{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:8px;}
  .trail-list{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:#fff5f8;border:1px solid #f4d4e1;color:var(--accent);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:600;}

  .actions{display:flex;gap:10px;margin-top:14px;}
  .actions .btn{flex:1;padding:11px 0;font-size:13px;}
  .hint{text-align:center;font-size:12px;color:var(--sub);margin-top:10px;letter-spacing:1px;}

  /* round summary modal */
  .mask{
    position:fixed;inset:0;background:rgba(40,20,30,.82);
    display:none;flex-direction:column;
    align-items:center;justify-content:center;
    padding:20px;z-index:100;
    backdrop-filter:blur(6px);
  }
  .mask.show{display:flex;}
  .round-card{
    background:#fff;border-radius:28px;
    width:100%;max-width:480px;
    display:flex;flex-direction:column;align-items:center;
    padding:36px 28px 32px;
    animation:scaleIn .3s ease;
  }
  @keyframes scaleIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
  .round-card .tag{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;border-radius:999px;
    padding:5px 18px;font-size:12px;font-weight:700;letter-spacing:2px;
    margin-bottom:16px;
  }
  .round-card .subtitle{font-size:13px;color:var(--sub);margin-bottom:20px;}
  .round-card .chips{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    max-height:320px;overflow-y:auto;padding:4px;
  }
  .round-card .chips .chip{
    font-size:13px;padding:8px 16px;
    background:#fff5f8;border:2px solid var(--accent);
    color:var(--accent);border-radius:999px;font-weight:700;
    box-shadow:0 4px 14px rgba(255,94,138,.2);
  }
  .round-card .cta{margin-top:24px;width:100%;}
  .round-card .cta .btn{width:100%;font-size:18px;padding:16px 0;}

  /* three-way final */
  #threeWayMask{background:rgba(30,15,22,.9);}
  .three-card{
    background:#fff;border-radius:28px;width:100%;max-width:480px;
    padding:30px 24px 28px;display:flex;flex-direction:column;align-items:center;
    animation:scaleIn .3s ease;
  }
  .three-card .tag{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;border-radius:999px;
    padding:5px 18px;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px;
  }
  .three-card .subtitle{font-size:13px;color:var(--sub);margin-bottom:18px;text-align:center;}
  .three-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;}
  .tcard{
    background:var(--card);border:3px solid transparent;border-radius:18px;
    padding:18px 8px;min-height:120px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:16px;font-weight:800;line-height:1.3;cursor:pointer;
    box-shadow:0 8px 20px rgba(180,90,120,.16);
    transition:transform .12s,border-color .15s;word-break:break-all;
  }
  .tcard small{display:block;font-size:10px;font-weight:600;color:var(--sub);margin-bottom:6px;letter-spacing:1px;}
  .tcard:active{transform:scale(.96);}
  .tcard.pick{border-color:var(--accent);background:#fff5f8;}

  /* ending screen */
  #endingMask{background:rgba(30,15,22,.92);}
  .ending-card{
    background:linear-gradient(160deg,#fff7fb,#fff3ea);
    border:2px solid #f4d4e1;
    border-radius:28px;width:100%;max-width:520px;
    display:flex;flex-direction:column;align-items:center;
    padding:28px 24px 26px;
    animation:scaleIn .3s ease;
    max-height:88vh;
  }
  .ending-card .tag{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;border-radius:999px;
    padding:5px 18px;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:8px;
  }
  .ending-card .subtitle{font-size:13px;color:var(--sub);margin-bottom:18px;text-align:center;}
  .ending-card .chips{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    overflow-y:auto;padding:6px;align-content:flex-start;
    max-height:46vh;width:100%;
  }
  .ending-card .chips .chip{
    font-size:13px;padding:8px 14px;
    background:#fff5f8;border:2px solid var(--accent);
    color:var(--accent);border-radius:999px;font-weight:700;
    transition:opacity .8s ease, transform .8s ease, filter .8s ease;
  }
  .ending-card .chips .chip.champ{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#fff;border-color:var(--accent);
    box-shadow:0 6px 18px rgba(255,94,138,.4);
  }
  .ending-card .chips .chip.gone{
    opacity:0;transform:scale(.55);filter:grayscale(1);
    pointer-events:none;
  }
  .ending-card .cta{margin-top:20px;width:100%;display:flex;gap:10px;}
  .ending-card .cta .btn{flex:1;padding:13px 0;font-size:15px;}

  /* final screen */
  #final{display:none;flex:1;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:30px 16px;gap:18px;}
  #final .crown{font-size:72px;animation:bob 2.4s ease-in-out infinite;}
  #final .winner{
    background:linear-gradient(135deg,#fff5f8,#fff0e0);
    border:3px solid var(--accent);border-radius:24px;padding:24px 36px;
    font-size:30px;font-weight:900;letter-spacing:3px;color:var(--accent);
    box-shadow:0 14px 30px rgba(255,94,138,.3);
  }
  #final .stat{font-size:14px;color:var(--sub);line-height:1.8;}
  #final .path{font-size:12px;color:var(--sub);margin-top:6px;}
  #final .path-chip{display:inline-block;background:#fff;border:1px solid #f4d4e1;border-radius:8px;
    padding:3px 8px;margin:2px;}

  /* history sheet */
  .sheet{
    position:fixed;inset:0;background:rgba(40,20,30,.55);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50;
    backdrop-filter:blur(3px);
  }
  .sheet.show{display:flex;}
  .sheet .inner{
    background:#fff;border-radius:24px;width:100%;max-width:460px;max-height:82vh;
    display:flex;flex-direction:column;overflow:hidden;animation:rise .2s ease;
    position:relative;
  }
  @keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h2{margin:0;padding:18px 20px 10px;font-size:18px;text-align:center;}
  .sheet .sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:6px;}
  .list{overflow-y:auto;padding:8px 18px 18px;-webkit-overflow-scrolling:touch;}
  .round-h{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:12px;color:var(--sub);
    letter-spacing:1px;}
  .round-h b{color:var(--accent);font-size:14px;}
  .row{display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;border-radius:12px;margin-bottom:6px;font-size:14px;}
  .row.win{background:#fff5f8;color:var(--accent);font-weight:700;}
  .row.lose{background:#f5f5f8;color:#aaa;}
  .row .t{flex:1;}
  .empty{text-align:center;color:var(--sub);padding:30px 0;font-size:14px;}
  .sheet .foot{padding:12px 18px 18px;}
  .sheet .foot .btn{width:100%;}
  .closeX{position:absolute;top:14px;right:18px;font-size:22px;color:var(--sub);cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>幸福二选一</h1>
    <p>锦标赛制 · 自己人专属</p>
  </header>

  <section id="start">
    <div class="emoji">🏆</div>
    <div class="tip">46 个 xp · 5 轮对决<br>选出你心里的 No.1</div>
    <div class="bracket-mini">
      第1轮：46进23 → 第2轮：23进12<br>
      第3轮：12进6 → 第4轮：6进3<br>
      第5轮：三选一 决出冠军 🏆
    </div>
    <button class="btn" id="startBtn">开 始</button>
  </section>

  <section id="game">
    <div class="progress">
      <span>已选 <span class="count" id="count">0</span> 个</span>
      <span id="roundLabel"></span>
    </div>
    <div class="round-tag" id="roundTag"></div>
    <div class="vs">
      <div class="card" id="cardA" onclick="choose(0)"><small>选这个</small><span></span></div>
      <div class="card" id="cardB" onclick="choose(1)"><small>选这个</small><span></span></div>
    </div>
    <div class="or">— 二 选 一 —</div>
    <div class="trail">
      <div class="trail-title">本届已晋级</div>
      <div class="trail-list" id="trail"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="openSheet()">赛程记录</button>
    </div>
    <div class="hint">点卡片即选择，胜者晋级下一轮</div>
  </section>

  <section id="final">
    <div class="crown">👑</div>
    <div style="font-size:14px;color:var(--sub);letter-spacing:2px;">本届冠军 xp</div>
    <div class="winner" id="winnerName">—</div>
    <div class="stat" id="finalStat"></div>
    <div class="path" id="path"></div>
    <div class="actions" style="width:100%;max-width:340px;">
      <button class="btn" onclick="playEnding()">🎬 观看完整淘汰</button>
      <button class="btn ghost" onclick="openSheet()">完整赛程</button>
      <button class="btn ghost" onclick="resetGame()">重新开始</button>
    </div>
  </section>
</div>

<!-- 每轮结束后的晋级大屏 -->
<div class="mask" id="roundMask">
  <div class="round-card">
    <div class="tag" id="maskTag">第1轮 结束</div>
    <div class="subtitle" id="maskSub">23 位选手晋级</div>
    <div class="chips" id="maskChips"></div>
    <div class="cta" id="maskCta">
      <button class="btn" id="nextRoundBtn" onclick="startNextRound()">开始下一轮</button>
    </div>
  </div>
</div>

<!-- 最后三轮：三选一 -->
<div class="mask" id="threeWayMask">
  <div class="three-card">
    <div class="tag">最后三轮 · 三选一</div>
    <div class="subtitle">从 3 位中选出你心中的冠军</div>
    <div class="three-grid" id="threeWayChips"></div>
  </div>
</div>

<!-- 完整淘汰结尾动画 -->
<div class="mask" id="endingMask">
  <div class="ending-card">
    <div class="tag" id="endingTag">完整淘汰 · 46 位选手</div>
    <div class="subtitle" id="endingSub">每 3 秒淘汰一轮…</div>
    <div class="chips" id="endingChips"></div>
    <div class="cta">
      <button class="btn ghost" id="endingSkip" onclick="skipEnding()">跳过</button>
      <button class="btn" id="endingRestart" style="display:none" onclick="resetGame()">重新开始</button>
    </div>
  </div>
</div>

<!-- 完整赛程 -->
<div class="sheet" id="sheet">
  <div class="inner">
    <span class="closeX" onclick="closeSheet()">✕</span>
    <h2>完整赛程</h2>
    <div class="sub" id="sheetSub"></div>
    <div class="list" id="list"></div>
    <div class="foot"><button class="btn" onclick="resetGame()">重新开始</button></div>
  </div>
</div>

<script>
const ITEMS = ["恨海情天","破镜重圆","镜花水月","枯木逢春","烂人真心","圣人私心","明月高悬","欢喜冤家","宿敌变挚友","挚友变宿敌","宿敌","挚友","相爱相杀","师徒","骨科","伪骨科","爱而不得","先婚后爱","强制爱","默默守护","青梅竹马","天降","年上","年下","救赎","一起腐烂","暗恋","明恋","双强","霸总娇妻","追妻火葬场","追夫火葬场","老夫老妻","对抗路","露水姻缘","白头偕老","日久生情","一见钟情","君臣","主仆","前世今生","错位时空","兰因絮果","莞莞类卿","明媒正娶","地下情"];

const ROUND_NAMES = ["第1轮 · 46进23","第2轮 · 23进12","第3轮 · 12进6","第4轮 · 6进3","第5轮 · 三选一决出冠军"];

function buildBracket(){
  const rounds = [];
  let cur = ITEMS.slice();
  while(cur.length > 1){
    const next = [];
    const pairings = [];
    for(let i=0;i<cur.length;i+=2){
      if(i+1 < cur.length){
        pairings.push([cur[i], cur[i+1]]);
        next.push(null);
      } else {
        next.push(cur[i]);
      }
    }
    rounds.push(pairings);
    cur = next;
  }
  return {rounds};
}

const BR = buildBracket();

let ri = 0, pi = 0, history = [], winners = [], totalPicks = 0, locked = false;
let endingTimers = [];
let threeWayItems = [], threeWayRound = 0, threeWayLocked = false;

function loadPair(){
  const pair = BR.rounds[ri][pi];
  document.querySelector('#cardA span').textContent = pair[0];
  document.querySelector('#cardB span').textContent = pair[1];
  document.getElementById('cardA').classList.remove('pick','dim');
  document.getElementById('cardB').classList.remove('pick','dim');
  document.getElementById('roundTag').innerHTML =
    `本轮 <b>${ROUND_NAMES[ri]}</b>　对战 <b>${pi+1}/${BR.rounds[ri].length}</b>`;
  document.getElementById('roundLabel').textContent =
    `总进度 ${totalRound()+1} / ${totalRounds()}`;
  locked = false;
  renderTrail();
}

function totalRounds(){
  let n=0; BR.rounds.forEach(r=>n+=r.length); return n;
}
function totalRound(){
  let n=0;
  for(let i=0;i<ri;i++) n += BR.rounds[i].length;
  return n + pi;
}

function choose(i){
  if(locked) return;
  locked = true;
  const pair = BR.rounds[ri][pi];
  const win = pair[i], lose = pair[1-i];

  history.push({round:ri, idx:pi, a:pair[0], b:pair[1], pick:win});
  totalPicks++;

  if(!winners[ri]) winners[ri] = [];
  winners[ri].push(win);

  document.getElementById('cardA').classList.toggle('pick', i===0);
  document.getElementById('cardB').classList.toggle('pick', i===1);
  document.getElementById(i===0?'cardB':'cardA').classList.add('dim');
  document.getElementById('count').textContent = totalPicks;

  const totalInRound = BR.rounds[ri].length;

  setTimeout(()=>{
    pi++;
    if(pi < totalInRound){
      loadPair();
    } else {
      showRoundSummary(ri, winners[ri]);
    }
  }, 260);
}

function showRoundSummary(roundIdx, roundWinners){
  ri = roundIdx + 1;
  pi = 0;
  const prevWinners = roundWinners;
  if(ri < BR.rounds.length){
    for(let j=0,k=0;j<BR.rounds[ri].length;j++){
      BR.rounds[ri][j][0] = prevWinners[k] || '';
      if(prevWinners[k+1] !== undefined){
        BR.rounds[ri][j][1] = prevWinners[k+1];
      }
      k+=2;
    }
  }

  const roundName = roundIdx === ROUND_NAMES.length-1 ? '决赛' : ROUND_NAMES[roundIdx];
  document.getElementById('maskTag').textContent = roundName + ' 结束';
  const nextLabel = ri < ROUND_NAMES.length ? ROUND_NAMES[ri] : '冠军';
  document.getElementById('maskSub').textContent = `${roundWinners.length} 位选手晋级 · 进入 ${nextLabel}`;

  const chips = document.getElementById('maskChips');
  chips.innerHTML = roundWinners.map(w=>`<span class="chip">${w}</span>`).join('');

  const btn = document.getElementById('nextRoundBtn');
  if(roundWinners.length === 1){
    btn.textContent = '🏆 查看冠军';
    btn.onclick = ()=>{
      document.getElementById('roundMask').classList.remove('show');
      showFinal(roundWinners[0]);
    };
  } else if(roundWinners.length === 3){
    btn.textContent = '开始三选一';
    btn.onclick = ()=> showThreeWay(roundWinners, ri);
  } else {
    btn.textContent = '开始下一轮';
    btn.onclick = startNextRound;
  }

  document.getElementById('game').style.display = 'none';
  document.getElementById('roundMask').classList.add('show');
}

function startNextRound(){
  document.getElementById('roundMask').classList.remove('show');
  document.getElementById('game').style.display = 'flex';
  if(BR.rounds[ri]){
    loadPair();
  } else {
    showFinal(winners[winners.length-1][0]);
  }
}

/* ===== 最后三轮：三选一 ===== */
function showThreeWay(items, roundIdx){
  const box = document.getElementById('threeWayChips');
  box.innerHTML = items.map((w,idx)=>`<div class="tcard" id="tw${idx}" onclick="pickThreeWay(${idx})"><small>选这个</small><span>${w}</span></div>`).join('');
  document.getElementById('roundMask').classList.remove('show');
  document.getElementById('threeWayMask').classList.add('show');
  threeWayItems = items;
  threeWayRound = roundIdx;
  threeWayLocked = false;
}
function pickThreeWay(i){
  if(threeWayLocked) return;
  threeWayLocked = true;
  const champ = threeWayItems[i];
  // 记录赛果：冠军逐一击败其余两位
  threeWayItems.forEach(it=>{
    if(it !== champ) history.push({round:threeWayRound, idx:0, a:champ, b:it, pick:champ});
  });
  totalPicks++;
  if(!winners[threeWayRound]) winners[threeWayRound] = [];
  winners[threeWayRound].push(champ);
  document.getElementById('count').textContent = totalPicks;
  document.getElementById('tw'+i).classList.add('pick');
  setTimeout(()=>{
    document.getElementById('threeWayMask').classList.remove('show');
    showFinal(champ);
  }, 320);
}

function renderTrail(){
  const box = document.getElementById('trail');
  const all = [];
  for(let i=0;i<=ri;i++){
    (winners[i]||[]).forEach(w=>all.push({r:i, w}));
  }
  if(all.length===0){
    box.innerHTML = '<span style="color:#bbb;font-size:12px;">（暂未产生）</span>';
    return;
  }
  box.innerHTML = all.map(x=>`<span class="chip" title="${ROUND_NAMES[x.r]}">${x.w}</span>`).join('');
}

function showFinal(champ){
  document.getElementById('game').style.display='none';
  document.getElementById('final').style.display='flex';
  document.getElementById('winnerName').textContent = champ;
  document.getElementById('finalStat').innerHTML =
    `共经历 <b style="color:var(--accent)">${totalPicks}</b> 次抉择<br>本届冠军已诞生 👑`;

  const path = [];
  history.forEach(h=>{ if(h.pick===champ) path.push({r:h.round, beat: h.a===champ?h.b:h.a}); });
  document.getElementById('path').innerHTML = '冠军之路：' +
    path.map(p=>`<span class="path-chip">击败「${p.beat}」</span>`).join(' ');
}

/* ===== 完整淘汰结尾动画 ===== */
function buildElimination(){
  const elim = {};
  history.forEach(h=>{
    const loser = h.a === h.pick ? h.b : h.a;
    elim[loser] = h.round;
  });
  const champ = winners[winners.length-1][0];
  const maxR = history.length ? Math.max.apply(null, history.map(h=>h.round)) : 0;
  return {elim, champ, maxR};
}

function playEnding(){
  const {elim, champ, maxR} = buildElimination();
  const box = document.getElementById('endingChips');
  box.innerHTML = ITEMS.map(w=>{
    const isChamp = (w === champ);
    const round = isChamp ? 'done' : (elim[w] !== undefined ? elim[w] : 'done');
    return `<span class="chip${isChamp?' champ':''}" data-round="${round}">${w}</span>`;
  }).join('');

  document.getElementById('endingMask').classList.add('show');
  document.getElementById('endingTag').textContent = `完整淘汰 · ${ITEMS.length} 位选手`;
  document.getElementById('endingSub').textContent = '每 3 秒淘汰一轮…';
  document.getElementById('endingSkip').style.display = '';
  document.getElementById('endingRestart').style.display = 'none';

  // 清掉旧计时器
  endingTimers.forEach(clearTimeout);
  endingTimers = [];

  let r = 0;
  function step(){
    if(r > maxR){
      document.getElementById('endingSub').textContent = `🏆 最终冠军：${champ}`;
      document.getElementById('endingTag').textContent = '淘汰完成';
      document.getElementById('endingSkip').style.display = 'none';
      document.getElementById('endingRestart').style.display = '';
      return;
    }
    const toRemove = box.querySelectorAll(`.chip[data-round="${r}"]`);
    toRemove.forEach(el=>el.classList.add('gone'));
    document.getElementById('endingSub').textContent = `第 ${r+1} 轮已淘汰，剩余 ${box.querySelectorAll('.chip:not(.gone)').length} 位`;
    r++;
    endingTimers.push(setTimeout(step, 3000));
  }
  endingTimers.push(setTimeout(step, 3000));
}

function skipEnding(){
  endingTimers.forEach(clearTimeout);
  endingTimers = [];
  const {champ} = buildElimination();
  const box = document.getElementById('endingChips');
  box.querySelectorAll('.chip:not(.champ)').forEach(el=>el.classList.add('gone'));
  document.getElementById('endingSub').textContent = `🏆 最终冠军：${champ}`;
  document.getElementById('endingTag').textContent = '淘汰完成';
  document.getElementById('endingSkip').style.display = 'none';
  document.getElementById('endingRestart').style.display = '';
}

function openSheet(){
  const box = document.getElementById('list');
  const byRound = [];
  history.forEach(h=>{
    if(!byRound[h.round]) byRound[h.round] = [];
    byRound[h.round].push(h);
  });
  let html = '';
  for(let r=0;r<byRound.length;r++){
    if(!byRound[r]) continue;
    html += `<div class="round-h">第 <b>${r+1}</b> 轮 · ${ROUND_NAMES[r]||'决赛'}</div>`;
    byRound[r].forEach((h,i)=>{
      const win = h.pick, lose = h.a===win?h.b:h.a;
      html += `<div class="row win"><span class="t">✓ ${win}</span><span style="font-size:12px;color:var(--sub);">胜</span></div>
               <div class="row lose"><span class="t">${lose}</span><span style="font-size:12px;color:#ccc;">负</span></div>`;
    });
  }
  if(!html) html = '<div class="empty">还没开始呢～</div>';
  box.innerHTML = html;
  document.getElementById('sheetSub').textContent = `共 ${totalPicks} 次抉择 · 走过 ${byRound.filter(Boolean).length} 轮`;
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }

function resetGame(){
  endingTimers.forEach(clearTimeout);
  endingTimers = [];
  document.getElementById('endingMask').classList.remove('show');
  const fresh = buildBracket();
  BR.rounds.length = 0;
  fresh.rounds.forEach(r=>BR.rounds.push(r));
  ri=0;pi=0;history=[];winners=[];totalPicks=0;locked=false;
  document.getElementById('count').textContent='0';
  document.getElementById('final').style.display='none';
  document.getElementById('game').style.display='flex';
  document.getElementById('roundMask').classList.remove('show');
  closeSheet();
  loadPair();
}

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('start').style.display='none';
  document.getElementById('game').style.display='flex';
  loadPair();
};
document.getElementById('roundMask').onclick=()=>{};
document.getElementById('sheet').onclick=(e)=>{ if(e.target.id==='sheet') closeSheet(); };
</script>
</body>
